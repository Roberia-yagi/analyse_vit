[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyse_vit"
version = "0.1.0"
description = "Deterministic FLUX + SAM composite pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "Pillow",
]

[project.optional-dependencies]
generate = [
  "numpy<2",
  "torch",
  "diffusers",
  "segment-anything",
  "opencv-python",
  "transformers",
  "accelerate",
  "sentencepiece",
  "protobuf",
  "torchvision",
  "safetensors",
  "einops",
  "sam3 @ git+https://github.com/facebookresearch/sam3.git",
]
analysis-perception = [
  "torch",
  "accelerate",
  "sentencepiece",
  "protobuf",
  "torchvision",
  "safetensors",
  "open_clip_torch==2.30.0",
  "matplotlib",
  "scikit-learn",
  "perception_models @ git+https://github.com/facebookresearch/perception_models.git",
  "decord",
  "pycocotools",
]
analysis-qwen = [
  "torch",
  "transformers>=4.56.0,<5",
  "vllm>=0.14.0",
  "accelerate",
  "qwen-vl-utils",
  "sentencepiece",
  "protobuf",
  "torchvision",
  "safetensors",
  "matplotlib",
  "scikit-learn",
  "decord",
  "pycocotools",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
conflicts = [
  [
    { extra = "analysis-perception" },
    { extra = "generate" },
  ],
  [
    { extra = "analysis-qwen" },
    { extra = "generate" },
  ],
  [
    { extra = "analysis-perception" },
    { extra = "analysis-qwen" },
  ],
]
