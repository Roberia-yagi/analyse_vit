[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyse_vit"
version = "0.1.0"
description = "Deterministic FLUX + SAM composite pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<2",
  "Pillow",
  "torch",
  "diffusers",
  "segment-anything",
  "opencv-python",
  "transformers",
  "accelerate",
  "sentencepiece",
  "protobuf",
  "torchvision",
  "safetensors",
  "scikit-learn",
  "matplotlib",
  "perception_models @ git+https://github.com/facebookresearch/perception_models.git",
  "sam3 @ git+https://github.com/facebookresearch/sam3.git",
  "open_clip_torch==2.30.0",
  "einops",
  "decord",
  "pycocotools"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
